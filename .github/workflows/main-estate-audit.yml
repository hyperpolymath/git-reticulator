# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.

name: Central Estate CI/CD Audit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  estate-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      
      - name: Required Files Gate
        uses: hyperpolymath/cicd-suite/actions/required-files-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Code Hygiene Gate
        uses: hyperpolymath/cicd-suite/actions/code-hygiene-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Manifest Validation Gate
        uses: hyperpolymath/cicd-suite/actions/manifest-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Idris2 ABI Purity Gate
        uses: hyperpolymath/cicd-suite/actions/idris2-abi-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Zig UnifiedApiAdapter API Gate
        uses: hyperpolymath/cicd-suite/actions/zig-unified-api-adapter-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Contractile Validation Gate
        uses: hyperpolymath/cicd-suite/actions/contractile-validation-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Recipes Set Validation Gate
        uses: hyperpolymath/cicd-suite/actions/recipes-set-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Affirmation Document Gate
        uses: hyperpolymath/cicd-suite/actions/affirmation-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Academic Referencing Gate
        uses: hyperpolymath/cicd-suite/actions/referencing-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Semantic Audit Gate
        uses: hyperpolymath/cicd-suite/actions/semantic-audit-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: SPDX License Gate
        uses: hyperpolymath/cicd-suite/actions/spdx-license-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Proof Runner Gate
        uses: hyperpolymath/cicd-suite/actions/proof-runner-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: PRAT Testing Gate
        uses: hyperpolymath/cicd-suite/actions/prat-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Panic Attack & Pons Gate
        uses: hyperpolymath/cicd-suite/actions/custom-tools-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: WWW & Well-Known Compliance Gate
        uses: hyperpolymath/cicd-suite/actions/www-compliance-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: BoJ Cartridge Validation Gate
        uses: hyperpolymath/cicd-suite/actions/boj-cartridge-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Formatting Validation Gate
        uses: hyperpolymath/cicd-suite/actions/formatting-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Accreditations & Badges Gate
        uses: hyperpolymath/cicd-suite/actions/badges-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Metrics Extraction Gate
        uses: hyperpolymath/cicd-suite/actions/metrics-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Linguist & Banned Languages Gate
        uses: hyperpolymath/cicd-suite/actions/linguist-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Test & Benchmarks Dashboard Gate
        uses: hyperpolymath/cicd-suite/actions/tests-benches-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Hosting & Site Status Gate
        uses: hyperpolymath/cicd-suite/actions/hosting-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Git-Sea Analytics Gate
        uses: hyperpolymath/cicd-suite/actions/gitsea-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Trust & Humans Validation Gate
        uses: hyperpolymath/cicd-suite/actions/trust-humans-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Are We UnAPI Gate (Secret Scanning)
        uses: hyperpolymath/cicd-suite/actions/secrets-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
        
      - name: Reasonably Good Token Validation Gate
        uses: hyperpolymath/cicd-suite/actions/vaulted-tokens-check@4c772eb235b04455307d5c03cbbc4f45130f7f0f  # main
